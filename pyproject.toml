[project]
name = "vtk-archive"
version = "0.1.0"
description = "Read-only archive of the VTK GitLab project's issues, merge requests and discussions"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "linkify-it-py>=2.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
]

[project.scripts]
vtk-archive = "crawler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawler*", "builder*"]

[tool.pytest.ini_options]
# `attachments/` holds files downloaded from issue threads, some named `test_*.py`;
# collecting there makes pytest import code attached to decade-old bug reports.
testpaths = ["tests"]
norecursedirs = ["attachments", "data", "dist", ".cache", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415"]
